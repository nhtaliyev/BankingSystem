services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=BankingSystem;Username=postgres;Password=${DB_PASSWORD}
      - JWT__secretKey=${JWT_KEY}
      - JWT__issuer=BankingSystem
      - JWT__audience=BankingSystem
      - CardEncryption__HashKey=${CARD_HASH_KEY}
      - CardEncryption__EncryptionKey=${CARD_ENCRYPTION_KEY}
      # Only needed if a browser-based frontend calls the API:
      # - Cors__AllowedOrigins__0=http://localhost:5000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=BankingSystem
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: